name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check the tag matches every package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/*/package.json; do
            v=$(node -p "require('./$p').version")
            [ "$v" = "$tag" ] || { echo "$p is $v, the tag is $tag"; exit 1; }
          done

      - name: Build and test
        run: pnpm test

      - name: Pack
        run: pnpm --filter "./packages/**" -r pack --pack-destination "$PWD/dist"

      - name: Publish
        # The npm that ships with the pinned Node does trusted publishing (11.5.1 or newer); npm@latest
        # asks for a newer Node than the pin and fails to install. The ./ matters: npm reads a bare
        # dist/name.tgz as a GitHub user/repo.
        run: for f in ./dist/*.tgz; do npm publish "$f" --access public --provenance; done
