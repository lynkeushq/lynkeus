name: Close pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # The repository belongs to an organization, so its owner is never the
          # author: whoever can push here is the one whose pull requests stay open.
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission || true)
          case "$permission" in admin | write) exit 0 ;; esac
          gh pr close "$PR" --comment "Thanks for your interest. This repository is published for use and does not take contributions, so pull requests are closed automatically. You are welcome to fork it under the MIT license."
