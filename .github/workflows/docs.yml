name: Docs

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'website/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Each page's "last updated" date comes from its history.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      # Node 26 ships without corepack: pnpm comes from npm, at the version package.json pins.
      - name: Setup pnpm
        run: npm install -g "pnpm@$(node -p "require('../package.json').packageManager.split('@')[1]")"

      - name: Install
        run: pnpm install --frozen-lockfile --filter website

      - name: Check the pages describe nothing later than this release
        if: github.ref_type == 'tag'
        run: pnpm run check-versions

      - name: Build
        run: pnpm run build
