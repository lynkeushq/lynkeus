name: Docs

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'website/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Each page's "last updated" date comes from its history.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Node 26 ships without corepack: pnpm comes from npm, at the version package.json pins.
      - name: Setup pnpm
        run: npm install -g "pnpm@$(node -p "require('../package.json').packageManager.split('@')[1]")"

      # Only the site's dependencies, and none of the workspace's scripts: the root's prepare builds the
      # packages, whose dependencies this install leaves out.
      - name: Install
        run: pnpm install --frozen-lockfile --filter website --ignore-scripts

      - name: Check the pages describe nothing later than this release
        if: github.ref_type == 'tag'
        run: pnpm run check-versions

      - name: Build
        run: pnpm run build
