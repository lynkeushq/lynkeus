name: lynkeus_headless
description: Hosts a Flutter app inside `flutter test` for Lynkeus, with no simulator, so the same cases run headless.
version: 0.7.5
repository: https://github.com/lynkeushq/lynkeus
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: '>=3.47.9'

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  clock: ^1.1.1
  lynkeus_agent:
    path: ../lynkeus_agent

dev_dependencies:
  flutter_lints: ^6.0.0
