name: lynkeus_agent
description: The in-app agent that lets Lynkeus read and drive a Flutter app on a simulator, an emulator or a phone.
version: 0.7.5
repository: https://github.com/lynkeushq/lynkeus
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: '>=3.47.9'

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
