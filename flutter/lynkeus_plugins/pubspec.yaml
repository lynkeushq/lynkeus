name: lynkeus_plugins
description: Lets the Flutter plugins that have no method-channel default run on a Lynkeus host (headless or FastSim). Does nothing on a simulator or a phone.
version: 0.7.5
repository: https://github.com/lynkeushq/lynkeus
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: '>=3.47.9'

# The plugins' platform interfaces, never the plugins: an app keeps choosing its plugin versions. Each range runs
# from the first release with the API used here to the next major, and CI tests both ends (flutter-plugins.yml).
dependencies:
  flutter:
    sdk: flutter
  lynkeus_agent:
    path: ../lynkeus_agent
  shared_preferences_platform_interface: '>=2.4.0 <3.0.0'
  sqflite_platform_interface: '>=2.4.0 <3.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences: '>=2.3.0 <3.0.0'
  sqflite_common: '>=2.5.0 <3.0.0'
